command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: NWS_USER_AGENT
    value: "weather-app-bootcamp (student@example.com)"

  # Embedding endpoint used to embed the search query. MUST match the endpoint
  # the notebook used to embed documents, and EMBEDDING_DIM must match the
  # vector(N) column in weather_embeddings.
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  - name: EMBEDDING_DIM
    value: "1024"

  # Chat model for the GET /weather/search RAG summary.
  # See GET /diagnostics for names this app can actually query.
  - name: DATABRICKS_LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
