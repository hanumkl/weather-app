command:
  - "python"
  - "app.py"

env:
  # Preferred: name the Lakebase instance and let Databricks issue credentials.
  # MUST match the notebook's lakebase_instance widget, or the app searches a
  # different database than the one the notebook wrote to.
  # Run notebooks/list_lakebase_instances to find the name.
  - name: LAKEBASE_INSTANCE_NAME
    value: ""

  # Fallback when LAKEBASE_INSTANCE_NAME is blank: a Postgres URL in a secret.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: NWS_USER_AGENT
    value: "weather-app-bootcamp (student@example.com)"

  # Query embeddings run in-process via fastembed (ONNX), so no serving quota is
  # consumed by search. MUST match the model the ingestion notebook used, and
  # EMBEDDING_DIM must match the vector(N) column in weather_embeddings.
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: EMBEDDING_DIM
    value: "384"

  # Chat model for the GET /weather/search RAG summary.
  # See GET /diagnostics for names this app can actually query.
  - name: DATABRICKS_LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
