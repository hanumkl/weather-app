# Referenced by databricks.yml — two-task workflow: sync then embed
resources:
  jobs:
    weather_sync_embed_job:
      name: weather-sync-embed
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED
      tasks:
        - task_key: sync
          notebook_task:
            notebook_path: ../notebooks/sync_weather.py
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 0
        - task_key: embed
          depends_on:
            - task_key: sync
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 0
